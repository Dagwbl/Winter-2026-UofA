            .cold-bound { stroke: #00b0f0; stroke-width: 6; }
            .text-title { font-size: 18px; font-weight: bold; text-anchor: middle; }
            .text-label { font-size: 14px; text-anchor: middle; font-style: italic; }
            .text-case { font-size: 14px; font-weight: bold; }
        </style>
    </defs>

    <line x1="150" y1="0" x2="150" y2="700" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="700" class="grid-line" />
    <line x1="850" y1="0" x2="850" y2="700" class="grid-line" />
    
